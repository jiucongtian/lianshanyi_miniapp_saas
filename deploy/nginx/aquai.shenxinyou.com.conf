# ── aquai.shenxinyou.com 系统 Nginx 反代配置 ─────────────────────────────────
# 文件路径（系统 nginx）：/etc/nginx/conf.d/aquai.shenxinyou.com.conf
#
# 当前配置：HTTP only（域名未启用 HTTPS）
# 如需启用 HTTPS，参见下方注释块

# ── HTTP（当前方案）──────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name aquai.shenxinyou.com;

    # 访问日志
    access_log  /var/log/nginx/aquai.shenxinyou.com.access.log  main;
    error_log   /var/log/nginx/aquai.shenxinyou.com.error.log   warn;

    # 反代到 Docker 容器（127.0.0.1:8000）
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # 超时设置（AI 服务可能耗时较长，按需调整）
        proxy_connect_timeout  30s;
        proxy_read_timeout     120s;
        proxy_send_timeout     30s;

        # 关闭缓冲（适合流式 SSE 或实时响应）
        proxy_buffering    off;
        proxy_cache        off;
    }

    # 健康检查端点（供监控探针使用，不记录日志）
    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;
    }
}

