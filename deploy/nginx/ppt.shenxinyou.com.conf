# ── ppt.shenxinyou.com — Web 前端容器反代 ────────────────────────────────────
# 将 HTTP 请求强制跳转到 HTTPS
server {
    listen 80;
    server_name ppt.shenxinyou.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ppt.shenxinyou.com;

    # SSL 证书路径（宝塔申请 Let's Encrypt 后自动生成，或手动替换为实际路径）
    ssl_certificate     /www/server/panel/vhost/cert/ppt.shenxinyou.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/ppt.shenxinyou.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 反代到 Docker Web 容器（映射到宿主机 127.0.0.1:8080）
    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering    off;
    }

    # 安全响应头
    add_header X-Frame-Options         DENY;
    add_header X-Content-Type-Options  nosniff;
    add_header Referrer-Policy         strict-origin-when-cross-origin;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
